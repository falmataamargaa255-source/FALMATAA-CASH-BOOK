name: Build FALMATAA CASH BOOK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP hin argamne."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          if [ -f project/settings.gradle.kts ]; then
            echo "Project root: project"
          else
            ROOT=$(find project -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
            if [ -z "$ROOT" ]; then
              echo "settings.gradle.kts hin argamne."
              find project -maxdepth 3 -type f | head -50
              exit 1
            fi
            echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Set project root
        run: |
          if [ -z "${PROJECT_ROOT:-}" ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find "${PROJECT_ROOT}" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FALMATAA-CASH-BOOK-APK
          path: |
            ${{ env.PROJECT_ROOT }}/**/build/outputs/apk/**/*.apk
